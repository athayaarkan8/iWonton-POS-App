{% extends "base.html" %}{% block title %}Login · Wonton POS{% endblock %}{%
block content %}
<div class="login-wrap">
  <section class="login-card">
    <div class="brand-mark">♡</div>
    <p class="eyebrow">ORDER · KITCHEN · STOCK</p>
    <h1>Wonton POS</h1>
    <p class="text-muted mb-4">Masuk ke workspace jualan kamu.</p>
    <form action="{{ url_for('auth.login_post') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">Username</label
        ><input
          class="form-control form-control-lg"
          name="username"
          required
          autofocus
        />
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label
        ><input
          class="form-control form-control-lg"
          name="password"
          type="password"
          required
        />
      </div>
      <button class="btn btn-primary btn-lg w-100">Login →</button>
    </form>
  </section>
</div>
{% endblock %}
